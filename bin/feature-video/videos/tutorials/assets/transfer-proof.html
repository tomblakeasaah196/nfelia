<!doctype html>
<!-- A plain, unbranded "transfer successful" screen for the tutorials' shopper
     to upload as proof of payment. Made-up names and numbers; no bank's look.
     Rendered once to transfer-proof.png with Playwright, 390 x 760 at 2x. -->
<html><head><meta charset="utf-8"><style>
body { margin: 0; width: 390px; height: 760px; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #F4F5F7; color: #16181D; }
.top { padding: 18px 20px; font-weight: 600; font-size: 16px; text-align: center; border-bottom: 1px solid #E3E6EB; background: #fff; }
.tick { width: 74px; height: 74px; border-radius: 50%; background: #1E9E5A; margin: 38px auto 14px; display: grid; place-items: center; }
.tick svg { width: 40px; height: 40px; }
h1 { margin: 0; text-align: center; font-size: 21px; }
.amt { text-align: center; font-size: 34px; font-weight: 700; margin: 10px 0 4px; }
.when { text-align: center; color: #6B7280; font-size: 13px; }
.card { background: #fff; margin: 26px 18px 0; border-radius: 14px; padding: 6px 16px; }
.row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #EEF0F3; gap: 12px; }
.row:last-child { border-bottom: 0; }
.row span:first-child { color: #6B7280; }
.row span:last-child { font-weight: 600; text-align: right; }
</style></head><body>
<div class="top">Transfer receipt</div>
<div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
<h1>Transfer successful</h1>
<div class="amt">₦120,000.00</div>
<div class="when" id="when"></div>
<div class="card">
  <div class="row"><span>To</span><span>Adanna Luxe Hair</span></div>
  <div class="row"><span>Account</span><span>Moniepoint · 8031234567</span></div>
  <div class="row"><span>From</span><span>Chiamaka Nwosu</span></div>
  <div class="row"><span>Narration</span><span>Body wave bundles</span></div>
  <div class="row"><span>Reference</span><span>TRF 2026 4471 8832</span></div>
</div>
<script>document.getElementById('when').textContent = new Date().toLocaleString('en-NG', { dateStyle: 'medium', timeStyle: 'short' });</script>
</body></html>
