name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, secret sweep, deploy-exclusion proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax check over the tree
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! out=$(php -l "$f" 2>&1); then
              echo "::error file=$f::${out}"
              fail=1
            fi
          done < <(find . -type f -name '*.php' \
                    ! -path './vendor/*' ! -path './lib/*' -print0)
          exit $fail

      - name: No server-specific collation may be pinned
        run: |
          set -euo pipefail
          # The 2026-10-17 outage: config/database.php pinned
          # utf8mb4_0900_ai_ci (MySQL 8 only) in MYSQL_ATTR_INIT_COMMAND, so
          # every connection threw 1273 on MariaDB and the whole app returned
          # "Database connection failed." Never pin a versioned collation.
          # Comment-only lines are skipped: the note in config/database.php
          # explaining why there is no COLLATE names the collation itself.
          hits=$(grep -rn 'utf8mb4_0900' --include='*.php' \
                   --exclude-dir=vendor --exclude-dir=lib . \
                 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|#|/?\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::utf8mb4_0900_* is MySQL-8 only and does not exist on MariaDB. Remove the pinned collation."
            exit 1
          fi
          echo "OK: no version-pinned collation in the tree."

      - name: Secret sweep
        run: |
          set -euo pipefail
          fail=0

          if git ls-files | grep -qxE '\.env'; then
            echo "::error::.env is tracked in git"
            fail=1
          fi

          # Collect first: with -q on the first grep nothing reaches the
          # second, so the check could never fire.
          dumps=$(git ls-files | grep -iE '\.(sql|sql\.gz|dump)$' \
                  | grep -vE '^db/migrations/|^db/schema\.sql$' || true)
          if [ -n "$dumps" ]; then
            echo "$dumps"
            echo "::error::a database dump is tracked in git"
            fail=1
          fi

          # db/schema.sql is exempt above only while it stays structure-only:
          # no rows, and no DROP TABLE, so running it against the live
          # database by mistake fails instead of wiping it.
          if [ -f db/schema.sql ] && grep -nE '^[[:space:]]*(INSERT|REPLACE|LOAD[[:space:]]+DATA|DROP[[:space:]]+TABLE)' db/schema.sql; then
            echo "::error file=db/schema.sql::db/schema.sql must be structure only: no INSERT, REPLACE, LOAD DATA or DROP TABLE. See the header of the file."
            fail=1
          fi

          # Live Paystack keys must never be committed. The .env.example
          # placeholders are pk_live_xxxx / sk_live_xxxx, so require real
          # key material (hex-ish, 20+ chars) to trigger.
          if grep -rnE '\b[ps]k_live_[0-9a-f]{20,}' \
               --exclude-dir=vendor --exclude-dir=lib --exclude-dir=.git \
               --exclude='.env.example' . ; then
            echo "::error::a live Paystack key appears in the tree"
            fail=1
          fi

          # Credentials must come from .env, never literal PHP.
          if grep -rnE "(DB_PASS|DB_USER|MAIL_PASSWORD)\s*=>?\s*['\"][A-Za-z0-9@_.!-]{6,}" \
               --include='*.php' --exclude-dir=vendor --exclude-dir=lib \
               --exclude='.env.example' . ; then
            echo "::error::hardcoded credential found in PHP"
            fail=1
          fi

          exit $fail

      - name: Deploy exclusions must hold under tar (.deployignore)
        run: |
          set -euo pipefail

          # bin/deploy.sh copies the repo into the PUBLIC docroot with
          #   tar cf - --exclude-from=.deployignore -C "$REPO" .
          # Same invocation here, to a temp archive we can list. tar silently
          # ignores patterns that start or end with "/", so one rsync-style
          # entry puts .git, docs/ or a database dump on the public web with
          # no error anywhere. On 2026-10-17 a 252KB dump of the production
          # database was in fact being served at /smartqaq_nfelia_core.sql.
          tarball=$(mktemp); members=$(mktemp)
          trap 'rm -f "$tarball" "$members"' EXIT
          tar cf "$tarball" --exclude-from=.deployignore -C . .
          tar tf "$tarball" > "$members"

          fail=0
          for path in .git .github .gitignore .deployignore .cpanel.yml \
                      .env .user.ini php.ini docs bin db tests README.md; do
            if grep -qE "^\./${path//./\\.}(/|\$)" "$members"; then
              echo "::error file=.deployignore::'${path}' would be copied into the PUBLIC docroot — its .deployignore entry does not match under tar (patterns must not start or end with '/'; a root-only entry looks like './${path}')"
              fail=1
            fi
          done

          if grep -qE '\.sql$' "$members"; then
            echo "::error file=.deployignore::a .sql file would be copied into the public docroot"
            fail=1
          fi

          # And it must still be a real deploy: a pattern excluding everything
          # would otherwise sail through the checks above.
          for path in index.php config/database.php webhook/deploy.php \
                      lib/PHPMailer/src/PHPMailer.php; do
            if ! grep -qxF "./${path}" "$members"; then
              echo "::error file=.deployignore::'${path}' would NOT be deployed — a .deployignore pattern is too broad"
              fail=1
            fi
          done

          if [ "$fail" -eq 0 ]; then
            echo "OK: $(wc -l < "$members") members would deploy; none of the excluded paths among them."
          fi
          exit $fail

  notifications:
    name: Notifications and Nfelia Ops, end to end
    runs-on: ubuntu-latest
    services:
      mariadb:
        # The same server as production (README: MariaDB 10.11).
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          # The same name as a local copy: an early migration
          # (20261017120000_normalise_collations) names the database.
          MARIADB_DATABASE: smartqaq_nfelia_core
          MARIADB_USER: nf
          MARIADB_PASSWORD: nf_ci_pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, openssl, mbstring, gd, intl, zip, xmlreader, xmlwriter, fileinfo, iconv
          coverage: none

      - name: Tools the tests use (faketime for the cron's clock, the mysql client)
        run: sudo apt-get update -q && sudo apt-get install -yq faketime mariadb-client

      - name: Composer install
        run: composer install --no-dev --no-interaction --no-progress

      - name: A throwaway .env for the test copy
        run: |
          set -euo pipefail
          {
            echo "APP_NAME=Nfelia"
            echo "APP_ENV=testing"
            echo "APP_DEBUG=true"
            # A name, not an IP: passkeys need one (ui_test.js).
            echo "APP_URL=http://localhost:8099"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_NAME=smartqaq_nfelia_core"
            echo "DB_USER=nf"
            echo "DB_PASS=nf_ci_pass"
            echo "MAIL_HOST=127.0.0.1"
            echo "MAIL_PORT=2525"
            echo "MAIL_ENCRYPTION=tls"
            echo "MAIL_USERNAME=sink"
            echo "MAIL_PASSWORD=sink"
            echo "MAIL_FROM_ADDRESS=no-reply@nfelia.test"
            echo "PAYSTACK_SECRET_KEY=sk_test_ci_only"
            # The stand-in push service (push_sink.php): only real push
            # services and these are ever called (app/helpers/webpush.php).
            echo "PUSH_TEST_ENDPOINTS=http://127.0.0.1:8098/"
            php bin/vapid-keys.php
          } > .env

      - name: Database (schema, migrations, procedure)
        run: bash tests/notifications/setup.sh

      # Without JIT, as PHP 8.3 ships (no JIT buffer). setup-php turns JIT
      # on (opcache.jit=1235, a 256M buffer), and the built-in server uses
      # OPcache, so it ran the app JIT-compiled: on PHP 8.3.35 that crashed
      # the server outright (a general protection fault in php8.3) every
      # time a Records Book was made, while the same build ran fine from the
      # command line, with or without JIT.
      - name: Serve the app
        run: |
          php -d opcache.jit_buffer_size=0 -S 127.0.0.1:8099 -t . tests/notifications/router.php > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 50); do curl -sf -o /dev/null http://localhost:8099/login && exit 0; sleep 0.2; done
          echo "::error::the app did not start"; cat "$RUNNER_TEMP/app.log"; exit 1

      - name: Engine, every trigger over HTTP, the cron, the service worker, Nfelia Ops, the orders hub, the Records Book
        run: bash tests/notifications/run.sh engine flows cron sw ops/foundation ops/monitor ops/clients ops/sales orders/core ops/records

      # What the app itself said (PHP errors above all), right in the job's
      # log: the artifact below has the whole file.
      - name: The app's log, when a check above failed
        if: failure()
        run: |
          grep -v -E ' (Accepted|Closing)$' "$RUNNER_TEMP/app.log" | tail -n 60 || true
          echo "--- the app's last connections"; tail -n 6 "$RUNNER_TEMP/app.log" || true
          echo "--- is the app still running?"; pgrep -af 'php -S' || echo "no: the server process is gone"
          echo "--- what the kernel saw"; sudo dmesg | tail -n 15 || true
          echo "--- a Records Book made outside the web server"
          php -r 'require "tests/bootstrap.php"; require "app/helpers/records.php"; $db = get_db(); $id = records_queue($db, 2, ["charge" => "free", "sheets" => ["customers", "invoices"]]); var_dump(records_build($db, $id), $db->query("SELECT status, error FROM records_books WHERE id = " . $id)->fetch());'; echo "exit code $?"
          sudo dmesg | tail -n 5 || true

      - name: Browser for the UI checks
        id: browser
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      # The browser checks report but never hold up a deploy on their own:
      # the suites above cover every notification without a browser.
      - name: Bell, notifications page, settings, passkeys, Nfelia Ops (browser)
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        env:
          NF_UI_OUT: ${{ runner.temp }}/notification-screens
        run: bash tests/notifications/run.sh ui ops/ui

      - name: Keep the screenshots and the app's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-tests
          path: |
            ${{ runner.temp }}/notification-screens
            ${{ runner.temp }}/app.log
          if-no-files-found: ignore

  deploy:
    name: Deploy via webhook
    needs: [checks, notifications]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check secrets are configured
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          DEPLOY_WEBHOOK_URL:    ${{ vars.DEPLOY_WEBHOOK_URL }}
        run: |
          # Fail, never skip. A skipped deploy used to finish green, so a
          # push to main could look deployed when nothing reached the server.
          fail=0
          if [ -z "${DEPLOY_WEBHOOK_SECRET:-}" ]; then
            echo "::error::DEPLOY_WEBHOOK_SECRET is not set. Add it under Settings → Secrets and variables → Actions → Secrets. See DEPLOY.md."
            fail=1
          fi
          if [ -z "${DEPLOY_WEBHOOK_URL:-}" ]; then
            echo "::error::DEPLOY_WEBHOOK_URL is not set. It must be a Variable (Settings → Secrets and variables → Actions → Variables), not a Secret. See DEPLOY.md."
            fail=1
          fi
          exit $fail

      - name: POST to deploy webhook (streams server output back)
        env:
          DEPLOY_WEBHOOK_URL:    ${{ vars.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          # The secret travels only in the request header, never in the URL,
          # so it cannot leak into web-server access logs.
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT

          http_status=$(curl -sS -X POST \
            --max-time 900 \
            --output "$body_file" \
            --write-out "%{http_code}" \
            -H "X-Deploy-Token: ${DEPLOY_WEBHOOK_SECRET}" \
            -H "User-Agent: github-actions-nfelia/1.0" \
            "${DEPLOY_WEBHOOK_URL}") || {
              rc=$?
              echo "::error::curl failed with exit code ${rc} — check DEPLOY_WEBHOOK_URL and reachability"
              exit "$rc"
            }

          echo "----- webhook response body -----"
          cat "$body_file"
          echo ""
          echo "----- webhook returned HTTP ${http_status} -----"

          if [ "${http_status}" != "200" ]; then
            echo "::error::Deploy webhook returned HTTP ${http_status}"
            exit 1
          fi

          # Output is streamed, so the 200 is sent before the deploy finishes.
          # The marker line is the only trustworthy result.
          if ! grep -q '^\[webhook\] DEPLOY OK$' "$body_file"; then
            echo "::error::Deploy failed on the server (no '[webhook] DEPLOY OK' in response)"
            exit 1
          fi
