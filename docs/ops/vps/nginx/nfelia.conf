# Nfelia on nginx: everything the repository's .htaccess does, in nginx terms.
#   docroot  /var/www/nfelia/current  (a symlink to the release in use)
#   TLS      a Cloudflare Origin CA certificate; only Cloudflare may connect
#            (its client certificate is required: Authenticated Origin Pulls)
#   PHP      the "nfelia" FPM pool (php/nfelia-pool.conf)

server {
    listen 80;
    listen [::]:80;
    server_name nfelia.com *.nfelia.com nfelia.lpc.cm;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nfelia.com *.nfelia.com;
    root /var/www/nfelia/current;
    index index.php;

    ssl_certificate     /etc/nginx/ssl/nfelia.com.pem;
    ssl_certificate_key /etc/nginx/ssl/nfelia.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Only Cloudflare holds a certificate signed by this CA
    ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    access_log /var/log/nginx/nfelia.access.log;
    error_log  /var/log/nginx/nfelia.error.log;

    client_max_body_size 64m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain application/xml;
    gzip_min_length 1024;

    # ---- Security headers (the repository's .htaccess, same values) ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # HSTS is set at Cloudflare (SECURITY.md §4)

    # ---- Never served ----
    location ~ ^/(config|app|views|storage|vendor|lib|db|docs|tests|bin|node_modules)/ { return 403; }
    location ~ /\.(?!well-known) { return 403; }                       # dotfiles (.env, .git, .htaccess)
    location ~* \.(sql|gz|tar|zip|dump|bak|log|md|ini|lock|phar|sh|yml|yaml|example)$ { return 403; }
    location = /composer.json { return 403; }
    location = /error_log { return 403; }
    # the old public folders of files that are private now
    location ~ ^/uploads/(delivery_signoffs|order_proofs|booking_proofs)/ { return 403; }

    # ---- Error pages (the same standalone files .htaccess names) ----
    error_page 404 /views/404.php;
    error_page 500 502 503 504 /views/500.php;
    location = /views/404.php { internal; include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm-nfelia.sock; }
    location = /views/500.php { internal; include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm-nfelia.sock; }

    # ---- Uploads: files only, never scripts, cached a month ----
    location /uploads/ {
        location ~* \.(php[0-9]?|phtml|phar|pl|py|cgi|shtml?)$ { return 403; }
        # WebP copies are made by PHP on their first request, then served from disk
        try_files $uri @app;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Versioned assets: a year ----
    location ~ ^/(assets|icons)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";          # fonts on shop subdomains
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ ^/(sw|ops-sw)\.js$ { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location ~* ^/[^/]+\.(png|ico|svg|webmanifest|html)$ { try_files $uri =404; add_header Cache-Control "public, max-age=86400"; }

    # ---- The two PHP files served by name ----
    location = /og-image.php { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm-nfelia.sock; }
    # webhook/deploy.php is not used on the VPS (deploys come over SSH); it stays denied:
    location ^~ /webhook/ { return 404; }
    location ^~ /cron/ { return 404; }
    location ^~ /api/ { try_files /nonexistent @app; }   # /api/... always goes through the front controller

    # ---- Everything else: the front controller ----
    location / { try_files $uri $uri/ @app; }
    location @app {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param QUERY_STRING url=$uri&$args;
        fastcgi_pass unix:/run/php/php8.3-fpm-nfelia.sock;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    # No other .php file is reachable directly
    location ~ \.php$ { return 404; }
}
