; Nfelia PHP settings (FPM and CLI). Copied to /etc/php/8.3/{fpm,cli}/conf.d/.
; What the app needs matches the shared host's working values; OPcache is on.
memory_limit = 512M
max_execution_time = 120
max_input_time = 60
max_input_vars = 1000
post_max_size = 64M
upload_max_filesize = 32M
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = Africa/Lagos
realpath_cache_size = 4M
realpath_cache_ttl = 600

; OPcache: every deploy is a new release directory and reloads FPM, so
; files never change under a running cache: no timestamp checks at all.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = off          ; a JIT crash was seen on 8.3.35 during Records Book builds (CI note)

; Sessions: the app sets its own path and lifetime (config/app.php); these
; are the defaults underneath. For Redis sessions, set in the pool instead.
session.cookie_secure = 1
session.cookie_httponly = 1
session.use_strict_mode = 1
