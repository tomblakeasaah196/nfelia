; PHP-FPM pool for Nfelia. /etc/php/8.3/fpm/pool.d/nfelia.conf
[nfelia]
user = nfelia
group = nfelia
listen = /run/php/php8.3-fpm-nfelia.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; About 100 MB a worker on a normal page; the Records Book (up to 1 GB)
; runs from the cron, never here. On 4 GB: 12 workers.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.status_path = /fpm-status          ; not exposed by nginx; for local checks

request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /var/log/php8.3-fpm-nfelia.slow.log
catch_workers_output = yes
php_admin_value[error_log] = /var/www/nfelia/shared/storage/logs/php_errors.log
php_admin_flag[log_errors] = on
php_admin_value[open_basedir] = /var/www/nfelia:/tmp:/usr/share/php
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[sys_temp_dir] = /tmp

; Redis sessions (optional; php8.3-redis installed, redis-server local):
; php_admin_value[session.save_handler] = redis
; php_admin_value[session.save_path] = "tcp://127.0.0.1:6379?database=1"
